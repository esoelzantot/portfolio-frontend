<section class="services section" id="services">
  <div class="container flex-center">
    <h1 class="section-title-01" [class.dark]="isDarkTheme()">Services</h1>
    <h2 class="section-title-02" [class.dark]="isDarkTheme()">Services</h2>
    <div class="content">
      <div class="services-description">
        <h3 [class.dark]="isDarkTheme()">What I Provide</h3>
      </div>
      <ul class="services-list">
        <li class="service-container" *ngFor="let service of services">
          <!-- ===== Service Card ===== -->
          <div class="service-card" [class.dark]="isDarkTheme()">
            <i class="uil uil-brackets-curly" aria-hidden="true"></i>
            <h3 [class.dark]="isDarkTheme()">{{ service.title }}</h3>
            <button
              type="button"
              class="learn-more-btn"
              aria-haspopup="dialog"
              (click)="openModal(service)"
            >
              Learn More
              <i class="uil uil-arrow-circle-right" aria-hidden="true"></i>
            </button>
          </div>
        </li>
      </ul>
    </div>
  </div>
</section>

<!-- ===== Service Modal (one instance, shows the selected service) ===== -->
<app-modal
  [open]="isModalOpen"
  [dark]="isDarkTheme()"
  labelledBy="service-modal-title"
  (closed)="closeModal()"
>
  @if (selectedService; as service) {
    <div class="service-details">
      <h3 id="service-modal-title" [class.dark]="isDarkTheme()">
        {{ service.modalTitle }}
      </h3>
      <h4 [class.dark]="isDarkTheme()">What is {{ service.modalTitle }}?</h4>
      <p [class.dark]="isDarkTheme()">{{ service.modalDescription }}</p>
      <h4 [class.dark]="isDarkTheme()">What I provide</h4>
      <ul>
        @for (item of service.provisions; track $index) {
          <li [class.dark]="isDarkTheme()">
            <i class="uil uil-check-circle" aria-hidden="true"></i>
            <span>{{ item }}</span>
          </li>
        }
      </ul>
    </div>
  }
</app-modal>
