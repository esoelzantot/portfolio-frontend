<section class="home flex-center" id="home" [class.dark]="isDarkTheme()">
  <div class="home-container">
    <div class="media-icons">
      <a
        [href]="home?.facebook"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook"
        [class.dark]="isDarkTheme()"
        ><i class="uil uil-facebook" aria-hidden="true"></i
      ></a>
      <a
        [href]="home?.linkedin"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn"
        [class.dark]="isDarkTheme()"
        ><i class="uil uil-linkedin" aria-hidden="true"></i
      ></a>
      <a
        [href]="home?.github"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
        [class.dark]="isDarkTheme()"
        ><i class="uil uil-github" aria-hidden="true"></i
      ></a>
    </div>

    <div class="home-img">
      @if (home?.imageSrc) {
        <img [src]="imageURL + home?.imageSrc" [alt]="home?.name" />
      }
    </div>

    <div class="home-info">
      <h1 [class.dark]="isDarkTheme()">
        Hi, I am <span>{{ home?.name }}</span>
      </h1>
      <h3>{{ home?.title }}</h3>
      <p>{{ home?.description }}</p>
      <a [routerLink]="['/contact']" routerLinkActive="active" class="btn">
        Contact Me <i class="uil uil-arrow-circle-right" aria-hidden="true"></i>
      </a>
    </div>
  </div>
</section>
