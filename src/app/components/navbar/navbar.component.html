<header class="header" id="header" [class.dark]="isDarkTheme()">
  <!-- mobile only: dims the page behind the open menu; tapping it closes the menu -->
  <div
    class="nav_scrim"
    [class.show]="isMenuVisible"
    (click)="toggleMenu(false)"
    aria-hidden="true"
  ></div>

  <nav class="nav nav_container">
    <a [routerLink]="['/home']" class="nav_logo" [class.dark]="isDarkTheme()"
      >Eslam</a
    >

    <div
      class="nav_menu"
      id="nav_menu"
      [ngClass]="{ 'show-menu': isMenuVisible }"
      [class.dark]="isDarkTheme()"
    >
      <ul class="nav_list grid">
        @for (item of navItems; track item.path) {
          <li class="nav_item">
            <a
              [routerLink]="[item.path]"
              routerLinkActive="active"
              class="nav_link"
              [class.dark]="isDarkTheme()"
              (click)="toggleMenu(false)"
            >
              <i [class]="item.icon + ' nav_icon'" aria-hidden="true"></i>
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
      <button
        type="button"
        class="nav_close"
        [class.dark]="isDarkTheme()"
        aria-label="Close menu"
        (click)="toggleMenu(false)"
      >
        <i class="uil uil-times" aria-hidden="true"></i>
      </button>
    </div>

    <div class="nav_btns" [ngClass]="{ 'hide-btns': isMenuVisible }">
      <!-- theme change button -->
      <button
        type="button"
        class="change-theme"
        [class.dark]="isDarkTheme()"
        [attr.aria-label]="isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'"
        (click)="toggleTheme()"
        id="theme-button"
      >
        <i
          class="uil"
          [ngClass]="isDarkTheme() ? 'uil-sun' : 'uil-moon'"
          aria-hidden="true"
        ></i>
      </button>
      <button
        type="button"
        class="nav_toggle"
        [class.dark]="isDarkTheme()"
        id="nav_toggle"
        aria-label="Open menu"
        aria-controls="nav_menu"
        [attr.aria-expanded]="isMenuVisible"
        (click)="toggleMenu(true)"
      >
        <i class="uil uil-apps" aria-hidden="true"></i>
      </button>
    </div>
  </nav>
</header>
